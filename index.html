  return `<span class="stk ${p.shine||""}" title="${s.n}${p.shine?" "+p.shine:""}">${s.svg}</span>`;
}

function listOf(r) {
  const raw = r?.data ?? [];
  if (Array.isArray(raw)) return raw.map(x => x?.value !== undefined ? { key:x.key, value:x.value } : { key:x.key||x.id, value:x });
  if (raw && typeof raw === "object") return Object.entries(raw).map(([key,value]) => ({ key, value }));
  return [];
}
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

async function hashPass(email, pass) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(email.toLowerCase()+"|"+pass+"|ag"));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function freshUser(email, name, passHash, likesTags) {
  return {
    id: crypto.randomUUID(), email: email.toLowerCase(), name, passHash,
    createdAt: Date.now(), energy: ENERGY_MAX, energyDay: today(), coins: 40,
    lastLoginDay: today(), lastPackDay: today(),
    backpack: { packs: { emoji:1, denselands:0, hillfight:0 }, stickers: [] },
    avatar: { frame:"default" }, installed: [], playMs: {}, playTotalMs:0, streakDays:0, lastPlayDay:"", notes: [],
    banned:false, reportCount:0, reportsLog:[], lastFreeOrb:0, likesTags, bio:"", theme:{ light:false, lang:"pt" },
    friends: [], reqIn: [], reqOut: [],
    daily: { day: today(), playMin:0, likes:0, posted:false, pack:false, claimed:{} }
  };
}
function publicOf(u) {
  return { id:u.id, name:u.name, avatar:u.avatar, likesTags:u.likesTags||[], bio:u.bio||"", lastLoginDay:u.lastLoginDay };
}
async function saveMe() {

}

async function notify(userId, note) {
  const u = userId === me?.id ? me : await userById(userId);
  if (!u) return;
  u.notes = u.notes || [];
  u.notes.unshift({ id: crypto.randomUUID(), read:false, createdAt: Date.now(), ...note });
  u.notes = u.notes.slice(0,50);
  await saveUser(u);
  if (me && u.id === me.id) { me = u; refreshBadge(); }

function guardBan(){ if(me?.banned){ toast("Conta suspensa."); return true; } return false; }
function yesterday(){
  const d=new Date(); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function formatPlay(ms){
  const s=Math.max(0, Math.floor((ms||0)/1000));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h) return `${h}h ${m}min ${sec}s`;
  if(m) return `${m}min ${sec}s`;
  return `${sec}s`;
}
function bumpStreak(){
  const d=today();
  if(me.lastPlayDay===d) return;
  me.streakDays = me.lastPlayDay===yesterday() ? (me.streakDays||0)+1 : 1;
  me.lastPlayDay=d;
}
function offenseScore(){ return (me.streakDays||0) * (me.coins||0) * 100; }
function applyDaily(u){
  const d=today();
  if (u.energyDay!==d){ u.energy=ENERGY_MAX; u.energyDay=d; }
  if (u.lastPackDay!==d){ u.lastPackDay=d; u.backpack.packs=u.backpack.packs||{}; u.backpack.packs.emoji=(u.backpack.packs.emoji||0)+1; }
  u.lastLoginDay=d;
  if (u.lastPlayDay && u.lastPlayDay!==d && u.lastPlayDay!==yesterday()) u.streakDays=0;
  if (u.daily?.day!==d) u.daily={ day:d, playMin:0, playMs:0, likes:0, posted:false, pack:false, claimed:{} };
}

function authView() {
  const likes = [];
  app.innerHTML = `
    <p class="eyebrow">ArturGames</p><h1>${t("playToEnter")}</h1>
    <div class="tabs">
      <button class="tab on" data-auth="in">${t("login")}</button>
      <button class="tab" data-auth="up">${t("signup")}</button>
      <button class="tab" data-auth="reset">${t("forgot")}</button>
    </div>
    <form id="auth-form">
      <input class="field" name="name" placeholder="${t("name")}" style="display:none" />
      <input class="field" name="email" type="email" required placeholder="${t("email")}" />
      <input class="field" name="pass" type="password" minlength="4" placeholder="${t("pass")}" />
      <input class="field hidden" name="code" inputmode="numeric" maxlength="8" placeholder="${t("code")}" />
      <input class="field hidden" name="npass" type="password" minlength="4" placeholder="${t("newPass")}" />
      <p class="muted hidden" id="reset-help">${t("resetHelp")}</p>
      <div id="likes-box" class="hidden"><p class="muted">${t("likesHelp")}</p><div id="likes">${tagToggle(likes)}</div></div>
      <button class="cta" style="width:100%" type="submit">${t("login")}</button>
      <p class="err" id="auth-err"></p>
    </form>`;
  nav.innerHTML = "";
  let mode="in";
  bindTagPick(document.getElementById("likes"), likes);
  const form=document.getElementById("auth-form");
  const passEl=form.querySelector("[name=pass]");
  const codeEl=form.querySelector("[name=code]");
  const npassEl=form.querySelector("[name=npass]");
  const helpEl=document.getElementById("reset-help");
  function setMode(next){
    mode=next;
    app.querySelectorAll("[data-auth]").forEach(x=>x.classList.toggle("on", x.dataset.auth===next));
    form.querySelector("[name=name]").style.display = mode==="up"?"block":"none";
    document.getElementById("likes-box").classList.toggle("hidden", mode!=="up");
    passEl.classList.toggle("hidden", mode==="reset");
    passEl.required = mode!=="reset";
    codeEl.classList.toggle("hidden", mode!=="reset");
    npassEl.classList.toggle("hidden", mode!=="reset");
    helpEl.classList.toggle("hidden", mode!=="reset");
    form.querySelector(".cta").textContent = mode==="up"?t("signup"):mode==="reset"?t("resetPass"):t("login");
  }
  app.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => setMode(b.dataset.auth));
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd=new FormData(form);
    const email=String(fd.get("email")).trim().toLowerCase();
    const pass=String(fd.get("pass")||"");
    const name=(String(fd.get("name")||"").trim()||email.split("@")[0]).slice(0,18);
    const err=document.getElementById("auth-err"); err.textContent=t("wait");
    try {
      if (mode==="reset") {
        const code=String(fd.get("code")||"").trim();
        const npass=String(fd.get("npass")||"");
        if (!code) {
          let u=null; try{ u=(await db("get",T.users,email))?.value; }catch{}
          if (u) {
            const raw=String(Math.floor(100000+Math.random()*900000));
            u.resetHash=await hashPass(email,"reset|"+raw);
            u.resetUntil=Date.now()+20*60*1000;
            await saveUser(u);
            await sendResetEmail(email, raw);
          }
          err.textContent=t("resetSent");
          return;
        }
        if (npass.length<4) throw new Error(t("newPass"));
        const u=(await db("get",T.users,email))?.value;
        if(!u||!u.resetHash||!u.resetUntil||Date.now()>u.resetUntil) throw new Error(t("badCode"));
        const okHash=await hashPass(email,"reset|"+code);
        let ok=u.resetHash===okHash;
        if(!ok){
          try{
            const v=await sb.auth.verifyOtp({ email, token:code, type:"email" });
            ok=!v.error;
          }catch{}
        }
        if(!ok) throw new Error(t("badCode"));
        u.passHash=await hashPass(email,npass);
        u.resetHash=""; u.resetUntil=0;
        await saveUser(u);
        err.textContent=t("passChanged");
        setMode("in");
        return;
      }
      const hash=await hashPass(email,pass);
      if (mode==="up") {
        if (!likes.length) throw new Error(t("needTag"));
        let exists=null; try{ exists=(await db("get",T.users,email))?.value; }catch{}
        if (exists) throw new Error(t("emailUsed"));
        me=freshUser(email,name,hash,likes.slice());
        await saveMe();
      } else {
        const u=(await db("get",T.users,email))?.value;
        if(!u||u.passHash!==hash) throw new Error(t("badLogin"));
        me=u; me.notes=me.notes||[]; me.backpack.packs=me.backpack.packs||{emoji:0,denselands:0,hillfight:0};
        applyDaily(me); await saveMe();
      }
      localStorage.setItem("ag_session", JSON.stringify({email:me.email,id:me.id}));
      applyTheme(); render();
    } catch(ex){ err.textContent=ex.message; }
  };
}

async function openGame(id){
  const g=GAMES.find(x=>x.id===id);
  let local=0, inst=false, desc="--";
  try{
    const c=await caches.open(cacheName(id));
    inst=Boolean(await c.match(playUrl(id)));
    if(inst) for(const k of await c.keys()) local+=(await (await c.match(k)).arrayBuffer()).byteLength;
  }catch{}
  try{ const fj=await fetch(new URL("files.json",g.base)).then(r=>r.ok?r.json():null); if(fj?.description||fj?.desc) desc=fj.description||fj.desc; }catch{}
  overlay.classList.add("show");
  sheet.innerHTML=`
    <div class="name-row"><img class="icon" src="${g.base}icon.svg" /><h2 style="margin:0">${g.title}</h2></div>
    <div class="hero-card"><img src="${g.base}card.png" /></div>

    <p class="muted">Preço ${g.price||"grátis"} · 1 energia para baixar/apagar</p>
    <p class="muted">Neste aparelho: ${inst?fmt(local):"não baixado"}</p>
    <div class="row" style="margin-top:10px">
      ${inst?`<button class="cta" data-play>Jogar</button><button class="danger" data-del>Apagar</button>`:`<button class="cta" data-dl>Baixar</button>`}
      <button class="ghost" id="close-sheet">Fechar</button>

}

async function downloadGame(g){
  const err=document.getElementById("gerr"); err.textContent="Baixando…";
  try{
    await spendEnergy(1);
    const cache=await caches.open(cacheName(g.id));
    let html=await (await fetch(new URL("index.html",g.base))).text();
    html=html.replace(/navigator\.serviceWorker\.register\s*\(/g,"false && navigator.serviceWorker.register(");
    await cache.put(playUrl(g.id), new Response(html,{headers:{"Content-Type":"text/html; charset=utf-8"}}));
    try{ const ic=await fetch(new URL("icon.svg",g.base)); await cache.put(playUrl(g.id,"icon.svg"), new Response(await ic.arrayBuffer(),{headers:{"Content-Type":"image/svg+xml"}})); }catch{}
    await cache.put("__meta.json", new Response(JSON.stringify({id:g.id,base:g.base,keep:g.keep,files:g.files,lastUsed:{}}),{headers:{"Content-Type":"application/json"}}));
    if(!me.installed.includes(g.id)) me.installed.push(g.id);
    await saveMe();
    overlay.classList.remove("show"); render();
  }catch(ex){ err.textContent=ex.message; }
}
async function deleteGame(g){
  try{ await spendEnergy(1); await caches.delete(cacheName(g.id)); me.installed=(me.installed||[]).filter(x=>x!==g.id); await saveMe(); overlay.classList.remove("show"); render(); }
  catch(ex){ document.getElementById("gerr").textContent=ex.message; }
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas"); let w=img.width,h=img.height,max=720;
      if(w>max){ h=h*max/w; w=max; }
      c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=reject; img.src=url;
  });
}

async function stickerOnPost(id){
  if(guardBan()) return;
  if(!(me.backpack.stickers||[]).length) return toast("Sem figurinhas.");
  const pick=await pickSticker(); if(!pick) return;
  try{
    await spendEnergy(1);
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}`)===(typeof pick==="string"?pick:pick.id));
    if(ix>=0) me.backpack.stickers.splice(ix,1); await saveMe();
    const p=await loadPost(id); p.stickers=p.stickers||[]; p.stickers.push({stickerId:pick,from:me.id});
    await db("set",T.posts,id,p);
    if(p.authorId!==me.id) await notify(p.authorId,{type:"sticker",text:`${me.name} colou uma figurinha.`});
    render();

}
async function pickSticker(){
  const counts={}; (me.backpack.stickers||[]).forEach(it=>{ const k=typeof it==="string"?it:`${it.id}#${it.shine||""}`; counts[k]=(counts[k]||0)+1; });
  const ids=Object.keys(counts); if(!ids.length) return null;
  const item=await uiPick(t("sticker"), ids.map(id=>({id,label:`${stk(parseStk(id).id).n}${parseStk(id).shine?" "+parseStk(id).shine:""} (${counts[id]})`})));
  return item?.id||null;
}
async function reportThing(kind,targetId,postId){
  if(guardBan()) return;
  const picked=await uiPick(t("report"), REPORT_REASONS.map(r=>({id:r,label:t(r)})));
  if(!picked) return;
  let targetUser=null;
  if(kind==="post") targetUser=(await loadPost(targetId))?.authorId;
  else targetUser=((await loadPost(postId))?.comments||[]).find(c=>c.id===targetId)?.authorId;
  if(!targetUser||targetUser===me.id) return toast(t("cantReport"));
  const u=await userById(targetUser); if(!u) return;
  const day=today();
  u.reportsLog=u.reportsLog||[];
  u.reportsLog.push({ from:me.id, reason:picked.id, day, at:Date.now() });
  const same=u.reportsLog.filter(x=>x.reason===picked.id && x.day===day).length;
  if(same>=BAN_AT) u.banned=true;
  await saveUser(u);
  await notify(targetUser,{type:"report",text:u.banned?t("banned"):`${t("report")}: ${t(picked.id)}`});
  toast(t("reportSent"));
}

function chatId(a,b){ return [a,b].sort().join("_"); }
async function renderChat(box, otherId){

  const now=Date.now();

  const other=await userById(otherId);
  box.innerHTML=`<button class="ghost" id="backf">Voltar</button><h2>${escapeHtml(other?.name||"amigo")}</h2>

    renderChat(box, otherId);

}

function rollShine(){
  if (Math.random() > 0.1) return "";
  return Math.random() < 0.5 ? "gold" : "silver";
}
async function openPack(id){
  const p=PACKS.find(x=>x.id===id); if(!p||!(me.backpack.packs[id]>0)) return;
  me.backpack.packs[id]-=1;
  const got=[];
  for(let i=0;i<3;i++){
    const sid=p.stickers[Math.floor(Math.random()*p.stickers.length)];
    const shine=rollShine();
    const item=shine?`${sid}#${shine}`:sid;
    me.backpack.stickers.push(item);
    got.push(item);
  }
  if(!me.daily.claimed.pack){ me.daily.claimed.pack=true; me.coins+=5; }
  await saveMe();
  const shiny=got.map(parseStk).filter(x=>x.shine);
  openModal(`<h2>${t("packOpen")}</h2><div class="stickers">${got.map(stkIcon).join("")}</div>
    <p class="muted">${shiny.map(s=>s.shine==="gold"?t("shinyGold"):t("shinySilver")).join(" · ")}</p>
    <button class="cta" id="mok">${t("ok")}</button>`);
  document.getElementById("mok").onclick=()=>{ closeModal(); renderBag(); };
}
async function sendSticker(){
  if(guardBan()) return;
  if(!(me.backpack.stickers||[]).length) return toast("Sem figurinhas.");
  let people=[]; try{ people=listOf(await db("list",T.pub)).map(x=>x.value).filter(p=>p&&p.id!==me.id); }catch{}
  const who=await uiPick("Enviar para", people.map(p=>({id:p.id,label:p.name}))); if(!who) return;
  const pick=await pickSticker(); if(!pick) return;
  try{
    await spendEnergy(1);
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}`)===(typeof pick==="string"?pick:pick.id));
    if(ix>=0) me.backpack.stickers.splice(ix,1); await saveMe();
    await db("set",T.mail,crypto.randomUUID(),{to:who.id,from:me.id,fromName:me.name,stickerId:pick,createdAt:Date.now()});
    await notify(who.id,{type:"gift",text:`${me.name} te enviou uma figurinha.`});
    toast("Enviado."); renderBag();
  }catch(ex){ toast(ex.message); }
}

document.getElementById("scrim").onclick=closeSides;
document.getElementById("modal-bg").addEventListener("click",e=>{ if(e.target.id==="modal-bg") closeModal(); });
overlay.addEventListener("click",e=>{ if(e.target===overlay) overlay.classList.remove("show"); });

function markShift(e, down){
  if(e.code==="ShiftLeft" || e.key==="Shift" && e.location===1) shifts.left=down;
  if(e.code==="ShiftRight" || e.key==="Shift" && e.location===2) shifts.right=down;
  if(e.code==="ShiftLeft") shifts.left=down;
  if(e.code==="ShiftRight") shifts.right=down;
  if(shifts.left && shifts.right) startHold();
  else endHold();
}
function tickHold(){
  if(!playingId){ endHold(); return; }
  holdMs+=200;
  const hint=document.getElementById("exit-hint");
  hint.style.display="block";
  hint.textContent=`${t("holdExit")} ${Math.min(5,holdMs/1000).toFixed(1)}s`;
  if(holdMs>=5000){ hint.style.display="none"; holdMs=0; clearInterval(holdTimer); holdTimer=0; stopPlay(); }
}
function startHold(){ if(holdTimer || !playingId) return; holdMs=0; holdTimer=setInterval(tickHold,200); }
function endHold(){ clearInterval(holdTimer); holdTimer=0; holdMs=0; const h=document.getElementById("exit-hint"); if(h) h.style.display="none"; }

function onPlayKeyDown(e){ if(!playingId) return; markShift(e,true); }
function onPlayKeyUp(e){ if(!playingId) return; markShift(e,false); }
function onPlayTouchStart(e){ if(playingId && e.touches.length>=6) startHold(); else if(playingId && e.touches.length<6) endHold(); }
function onPlayTouchEnd(e){ if(e.touches.length<6) endHold(); }

function hookPlayEvents(){
  const frame=document.getElementById("frame");
  const add=(target)=>{
    if(!target || target.__agExit) return;
    target.__agExit=true;
    target.addEventListener("keydown", onPlayKeyDown, true);
    target.addEventListener("keyup", onPlayKeyUp, true);
    target.addEventListener("touchstart", onPlayTouchStart, {passive:true, capture:true});
    target.addEventListener("touchend", onPlayTouchEnd, {passive:true, capture:true});
    target.addEventListener("touchcancel", onPlayTouchEnd, {passive:true, capture:true});
  };
  add(window); add(document);
  try{
    const doc=frame.contentDocument;
    add(doc); add(doc.defaultView);
  }catch{}
}

window.addEventListener("keydown", onPlayKeyDown, true);
window.addEventListener("keyup", onPlayKeyUp, true);
document.getElementById("player").addEventListener("touchstart", onPlayTouchStart, {passive:true});
document.getElementById("player").addEventListener("touchend", onPlayTouchEnd, {passive:true});

async function stopPlay(){
  endHold();
  shifts.left=false; shifts.right=false;
  const id=playingId, started=playStart;
  playingId=null; playStart=0;
  document.getElementById("player").classList.remove("show");
  try{ document.getElementById("frame").src="about:blank"; }catch{}
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch{}
  if(id && started && me){
    const elapsed=Math.max(0, Date.now()-started);
    me.playMs=me.playMs||{};
    me.playMs[id]=(me.playMs[id]||0)+elapsed;
    me.playTotalMs=(me.playTotalMs||0)+elapsed;
    me.daily=me.daily||{};
    me.daily.playMs=(me.daily.playMs||0)+elapsed;
    me.daily.playMin=Math.floor((me.daily.playMs||0)/60000);
    const min=Math.floor(elapsed/60000);
    if(min>0) me.coins+=Math.min(15,min);
    if((me.daily.playMs>=5*60000) && !me.daily.claimed.play){ me.daily.claimed.play=true; me.coins+=10; }
    bumpStreak();
    try{ await saveMe(); }catch{}
    navigator.serviceWorker?.controller?.postMessage({type:"evict",id});
  }
}

async function boot(){
  if(location.protocol!=="file:" && "serviceWorker" in navigator){ try{ await navigator.serviceWorker.register("sw.js"); }catch{} }
  const sess=JSON.parse(localStorage.getItem("ag_session")||"null");
  if(sess?.email){
    try{
      const r=await db("get",T.users,sess.email);
      if(r?.value){ me=r.value; me.notes=me.notes||[]; me.backpack.packs=me.backpack.packs||{emoji:0,denselands:0,hillfight:0}; applyDaily(me); await saveMe(); }
    }catch{}
  }
  applyTheme(); render();
}
boot();
</script>
