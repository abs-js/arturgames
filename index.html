function slugLink(link){
  try{
    const u=new URL(link.startsWith("http")?link:"https://"+link);
    const p=u.pathname.replace(/\//g,"").toLowerCase();
    if(p==="lolg") return "hillfight";
    return p||"game";
  }catch{ return "game"; }
}
function baseLink(link){
  const s=(link.startsWith("http")?link:"https://"+link).replace(/\/?$/,"/");
  return s;
}
async function loadCatalog(){
  const fallback=GAMES.slice();
  try{
    const rows=await fetch("asNew.json").then(r=>r.ok?r.json():null);
    if(!Array.isArray(rows)||!rows.length) return;
    const next=[];
    for(const row of rows){
      const base=baseLink(row.link);
      const id=slugLink(row.link);
      const old=fallback.find(g=>g.id===id)||{};
      let fj={};
      try{ fj=await fetch(base+"files.json").then(r=>r.ok?r.json():{}); }catch{}
      next.push({
        id,
        title: fj.title || old.title || String(fj.id||id),
        base,
        tags: fj.tags || old.tags || [],
        genre: old.genre||"",
        price: fj.price ?? old.price ?? 0,
        keep: fj.keep || old.keep || ["index.html","icon.svg"],
        files: fj.files || old.files || ["icon.svg","card.png"],
        version: fj.version || "1.0.0",
        catalogVersion: row.lastUpdate || "1.0.0",
        catalogNew: Boolean(row.new),
        as_new: fj.as_new || "",
        description: fj.description || fj.desc || "--",
        hard: Boolean(fj.hard || /difícil|extremo|dificil/i.test(fj.difficulty||""))
      });
    }
    if(next.length) GAMES=next;
  }catch{}
}

function allowNote(u, type){

  if(type==="post"||type==="comment"||type==="reply") return n.post!==false;
  if(type==="newGame") return n.newGame!==false;

  return true;
}

function applyDaily(u){
  const d=today();
  if (u.energyDay!==d){ u.energy=ENERGY_MAX; u.energyDay=d; }
  if (u.lastPackDay!==d){ u.lastPackDay=d; u.backpack.packs=u.backpack.packs||{}; u.backpack.packs.emoji=(u.backpack.packs.emoji||0)+1; }
  u.lastLoginDay=d;
  if (u.lastPlayDay && u.lastPlayDay!==d && u.lastPlayDay!==yesterday()) u.streakDays=0;
  if (u.daily?.day!==d) {
    const seed=d.split("-").join("");
    const pool=CHALLENGE_POOL.slice();
    const list=[];
    for(let i=0;i<4 && pool.length;i++){
      const idx=Number(seed[i%seed.length]||0)%pool.length;
      list.push(pool.splice(idx%pool.length,1)[0].id);
    }
    u.daily={ day:d, playMin:0, playMs:0, likes:0, posted:false, pack:false, claimed:{}, stick:0, chats:0, posts:0, packs:0, list };
  }
  if(!u.menu) u.menu=MENU_BLOCKS.map(b=>({id:b.id,on:true}));
  if(!u.notify) u.notify={ chat:true, newGame:true, gameUpd:true, post:true, login:true, friend:true, friendOk:true };

      <button class="cta" style="width:100%" type="submit">${t("login")}</button>
      <p class="err" id="auth-err"></p>
    </form>`;
  nav.innerHTML = "";
  let mode="in";
  bindTagPick(document.getElementById("likes"), likes);
  const form=document.getElementById("auth-form");
  const passEl=form.querySelector("[name=pass]");
  const codeEl=form.querySelector("[name=code]");
  const npassEl=form.querySelector("[name=npass]");
  const helpEl=document.getElementById("reset-help");
  function setMode(next){
    mode=next;
    app.querySelectorAll("[data-auth]").forEach(x=>x.classList.toggle("on", x.dataset.auth===next));
    form.querySelector("[name=name]").style.display = mode==="up"?"block":"none";
    document.getElementById("likes-box").classList.toggle("hidden", mode!=="up");
    passEl.classList.toggle("hidden", mode==="reset");
    passEl.required = mode!=="reset";
    codeEl.classList.toggle("hidden", mode!=="reset");
    npassEl.classList.toggle("hidden", mode!=="reset");
    helpEl.classList.toggle("hidden", mode!=="reset");
    form.querySelector(".cta").textContent = mode==="up"?t("signup"):mode==="reset"?t("resetPass"):t("login");
  }
  app.querySelectorAll("[data-auth]").forEach(b => b.onclick = () => setMode(b.dataset.auth));
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd=new FormData(form);
    const email=String(fd.get("email")).trim().toLowerCase();
    const pass=String(fd.get("pass")||"");
    const name=(String(fd.get("name")||"").trim()||email.split("@")[0]).slice(0,18);
    const err=document.getElementById("auth-err"); err.textContent=t("wait");
    try {
      if (mode==="reset") {
        const code=String(fd.get("code")||"").trim();
        const npass=String(fd.get("npass")||"");
        if (!code) {
          let u=null; try{ u=(await db("get",T.users,email))?.value; }catch{}
          if (u) {
            const raw=String(Math.floor(100000+Math.random()*900000));
            u.resetHash=await hashPass(email,"reset|"+raw);
            u.resetUntil=Date.now()+20*60*1000;
            await saveUser(u);
            await sendResetEmail(email, raw);
          }
          err.textContent=t("resetSent");
          return;
        }
        if (npass.length<4) throw new Error(t("newPass"));
        const u=(await db("get",T.users,email))?.value;
        if(!u||!u.resetHash||!u.resetUntil||Date.now()>u.resetUntil) throw new Error(t("badCode"));
        const okHash=await hashPass(email,"reset|"+code);
        let ok=u.resetHash===okHash;
        if(!ok){
          try{
            const v=await sb.auth.verifyOtp({ email, token:code, type:"email" });
            ok=!v.error;
          }catch{}
        }
        if(!ok) throw new Error(t("badCode"));
        u.passHash=await hashPass(email,npass);
        u.resetHash=""; u.resetUntil=0;
        await saveUser(u);
        err.textContent=t("passChanged");
        setMode("in");
        return;
      }
      const hash=await hashPass(email,pass);
      if (mode==="up") {
        if (!likes.length) throw new Error(t("needTag"));
        let exists=null; try{ exists=(await db("get",T.users,email))?.value; }catch{}
        if (exists) throw new Error(t("emailUsed"));
        me=freshUser(email,name,hash,likes.slice());
        await saveMe();
      } else {
        const u=(await db("get",T.users,email))?.value;
        if(!u||u.passHash!==hash) throw new Error(t("badLogin"));
        me=u; me.notes=me.notes||[]; me.backpack.packs=me.backpack.packs||{emoji:0,denselands:0,hillfight:0,driftmania:0};
        applyDaily(me); await saveMe();
      }
      localStorage.setItem("ag_session", JSON.stringify({email:me.email,id:me.id}));
      applyTheme(); render();
    } catch(ex){ err.textContent=ex.message; }
  };
}

async function openGame(id){

  }catch{}
  const stats=(await gameStats())[id]||{downloads:0,likes:0,likers:[]};

    <p class="muted">${t("onDevice")}: ${inst?fmt(local):"—"} · v${g.version||"—"}</p>

    <div id="dlbox" class="hidden"><div class="bar"><i id="dlbar"></i></div><p class="muted" id="dltxt"></p></div>

      ${needUp?`<button class="cta" data-up>Atualizar</button>`:""}

async function downloadGame(g, isUpdate){
  const err=document.getElementById("gerr");
  const box=document.getElementById("dlbox");
  const bar=document.getElementById("dlbar");
  const txt=document.getElementById("dltxt");
  try{
    await spendEnergy(1);
    box.classList.remove("hidden");
    const paths=["index.html","icon.svg",...(g.files||[])].filter((v,i,a)=>a.indexOf(v)===i);
    let total=0, known=0;
    const sizes=[];
    for(const p of paths){
      try{
        const r=await fetch(new URL(p,g.base), {method:"HEAD"});
        const n=Number(r.headers.get("content-length")||0);
        sizes.push(n); if(n){ total+=n; known++; }
      }catch{ sizes.push(0); }
    }
    txt.textContent = total? `${fmt(total)}` : "...";
    const cache=await caches.open(cacheName(g.id));
    let done=0;
    for(let i=0;i<paths.length;i++){
      const p=paths[i];
      const res=await fetch(new URL(p,g.base));
      let buf=await res.arrayBuffer();
      done+=buf.byteLength||sizes[i]||1;
      if(p==="index.html"){
        let html=new TextDecoder().decode(buf);
        html=html.replace(/navigator\.serviceWorker\.register\s*\(/g,"false && navigator.serviceWorker.register(");
        await cache.put(playUrl(g.id), new Response(html,{headers:{"Content-Type":"text/html; charset=utf-8"}}));
      } else {
        await cache.put(playUrl(g.id,p), new Response(buf,{headers:{"Content-Type":res.headers.get("content-type")||"application/octet-stream"}}));
      }
      const pct=Math.min(100, Math.round(done/Math.max(total,done)*100));
      bar.style.width=pct+"%";
      txt.textContent=`${fmt(done)}${total?" / "+fmt(total):""} (${pct}%)`;
    }
    await cache.put("__meta.json", new Response(JSON.stringify({id:g.id,base:g.base,keep:g.keep,files:g.files,version:g.version,lastUsed:{}}),{headers:{"Content-Type":"application/json"}}));
    if(!me.installed.includes(g.id)) me.installed.push(g.id);
    me.installedVer=me.installedVer||{}; me.installedVer[g.id]=g.version;
    await saveMe();
    if(!isUpdate){
      const st=(await db("get",T.games,g.id).catch(()=>null))?.value||{downloads:0,likes:0,likers:[]};
      st.downloads=(st.downloads||0)+1;
      await db("set",T.games,g.id,st);
    }
    overlay.classList.remove("show"); render();
  }catch(ex){ err.textContent=ex.message; }
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas"); let w=img.width,h=img.height,max=720;
      if(w>max){ h=h*max/w; w=max; }
      c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=reject; img.src=url;
  });
}

async function createPost(tags, vis="all"){
  if(guardBan()) return;
  const err=document.getElementById("perr");
  try{
    const text=cleanText(document.getElementById("ptext").value.trim());
    if(text.length<2) throw new Error(t("writeSomething"));
    await spendEnergy(1);
    const post={ id:crypto.randomUUID(), authorId:me.id, authorName:me.name, gameId:document.getElementById("pgame").value,
      text:text.slice(0,280), image:postImage||"", tags:(tags||[]).slice(0,4), vis: vis==="friends"?"friends":"all",
      avatar: me.avatar||{}, createdAt:Date.now(), likes:[], comments:[], stickers:[] };
    await db("set",T.posts,post.id,post);
    postImage=""; me.daily.posted=true; me.daily.posts=(me.daily.posts||0)+1;
    if(!me.daily.claimed.post){ me.daily.claimed.post=true; me.coins+=10; } await saveMe();

async function loadPost(id){ return (await db("get",T.posts,id))?.value; }
async function likePost(id){
  const p=await loadPost(id); p.likes=p.likes||[];
  if(p.likes.includes(me.id)) p.likes=p.likes.filter(x=>x!==me.id);
  else { p.likes.push(me.id); me.daily.likes+=1; if(me.daily.likes>=3&&!me.daily.claimed.likes){ me.daily.claimed.likes=true; me.coins+=8; } await saveMe(); }
  await db("set",T.posts,id,p); render();

async function commentPost(id,parentId){
  if(guardBan()) return;
  const text=await uiText(parentId?"Responder":"Comentar","texto");
  if(!text) return;
  const p=await loadPost(id); p.comments=p.comments||[];
  p.comments.push({ id:crypto.randomUUID(), parentId:parentId||null, authorId:me.id, authorName:me.name, text:cleanText(text).slice(0,140), createdAt:Date.now() });
  await db("set",T.posts,id,p);
  const target=parentId?(p.comments.find(c=>c.id===parentId)||{}).authorId:p.authorId;
  if(target&&target!==me.id) await notify(target,{type:"comment",text:`${me.name} comentou.`});
  render();
}
async function stickerOnPost(id){
  if(guardBan()) return;
  if(!(me.backpack.stickers||[]).length) return toast("Sem figurinhas.");
  const pick=await pickSticker(); if(!pick) return;
  try{
    await spendEnergy(1);
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}`)===(typeof pick==="string"?pick:pick.id));
    if(ix>=0) me.backpack.stickers.splice(ix,1); await saveMe();
    const p=await loadPost(id); p.stickers=p.stickers||[]; p.stickers.push({stickerId:pick,from:me.id});
    await db("set",T.posts,id,p);
    me.daily.stick=(me.daily.stick||0)+1; await saveMe();
    if(p.authorId!==me.id) await notify(p.authorId,{type:"sticker",text:`${me.name} colou uma figurinha.`});
    render();
  }catch(ex){ toast(ex.message); }
}
async function pickSticker(){
  const counts={}; (me.backpack.stickers||[]).forEach(it=>{ const k=typeof it==="string"?it:`${it.id}#${it.shine||""}`; counts[k]=(counts[k]||0)+1; });
  const ids=Object.keys(counts); if(!ids.length) return null;
  const item=await uiPick(t("sticker"), ids.map(id=>({id,label:`${stk(parseStk(id).id).n}${parseStk(id).shine?" "+parseStk(id).shine:""} (${counts[id]})`})));
  return item?.id||null;
}
async function reportThing(kind,targetId,postId){
  if(guardBan()) return;
  const picked=await uiPick(t("report"), REPORT_REASONS.map(r=>({id:r,label:t(r)})));
  if(!picked) return;
  let targetUser=null;
  if(kind==="post") targetUser=(await loadPost(targetId))?.authorId;
  else targetUser=((await loadPost(postId))?.comments||[]).find(c=>c.id===targetId)?.authorId;
  if(!targetUser||targetUser===me.id) return toast(t("cantReport"));
  const u=await userById(targetUser); if(!u) return;
  const day=today();
  u.reportsLog=u.reportsLog||[];
  u.reportsLog.push({ from:me.id, reason:picked.id, day, at:Date.now() });
  const same=u.reportsLog.filter(x=>x.reason===picked.id && x.day===day).length;
  if(same>=BAN_AT) u.banned=true;
  await saveUser(u);
  await notify(targetUser,{type:"report",text:u.banned?t("banned"):`${t("report")}: ${t(picked.id)}`});
  toast(t("reportSent"));
}

async function unreadChat(otherId){
  try{
    const id=chatId(me.id,otherId);
    const chat=(await db("get",T.chats,id))?.value;
    const last=(chat?.messages||[]).slice(-1)[0];
    if(!last) return false;
    return last.from!==me.id && last.at>(me.chatSeen?.[id]||0);
  }catch{ return false; }
}

    document.getElementById("afind").oninput=()=>amigosView();

    const rows=await Promise.all((me.reqIn||[]).map(async id=>{
      const u=await userById(id);
      return `<div class="item">${avatarHTML(u||{name:"?"},36)} <span class="uname" data-user="${id}">${escapeHtml(u?.name||id)}</span>
        <button class="cta" data-ok="${id}">${t("accept")}</button> <button class="ghost" data-no="${id}">${t("deny")}</button></div>`;

        <button class="${unread?"chat-alert":"cta"}" data-ch="${p.id}">${t("chat")}</button></div>`).join("")||`<p class="muted">${t("needFriend")}</p>`;
      box.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{chatWith=b.dataset.ch;amigosView();});
      bindUsers();

function chatId(a,b){ return [a,b].sort().join("_"); }
async function renderChat(box, otherId){
  const id=chatId(me.id,otherId);
  let chat=(await db("get",T.chats,id).catch(()=>null))?.value || { id, users:[me.id,otherId], messages:[] };
  const now=Date.now();
  chat.messages=(chat.messages||[]).filter(m=>now-m.at<MSG_TTL);
  const other=await userById(otherId);
  me.chatSeen=me.chatSeen||{}; me.chatSeen[id]=Date.now(); saveMe();
  box.innerHTML=`<button class="ghost" id="backf">${t("back")}</button>
    <div class="post-head">${avatarHTML(other||{name:"?"},40)}<h2 class="uname" data-user="${otherId}">${escapeHtml(other?.name||"amigo")}</h2></div>
    <p class="muted">${t("msgGone")}</p>
    <div class="chat-log">${chat.messages.map(m=>`<div class="bubble"><b>${m.from===me.id?"você":escapeHtml(other?.name||"")}</b> ${escapeHtml(m.text||"")}${m.kind==="energy"?" ⚡":""}${m.sticker?stkIcon(m.sticker):""}</div>`).join("")||`<p class="muted">${t("empty")}</p>`}</div>
    <div class="chat-bar">
      <input class="field" id="cmsg" placeholder="${t("send")}" />
      <button class="cta" id="csend">${t("send")}</button>
      <button class="ghost" id="cstk">${t("sticker")}</button>
      <button class="ghost" id="cenergy">⚡ 50</button>
    </div>`;
  document.getElementById("backf").onclick=()=>{chatWith=null;amigosView();};
  document.getElementById("csend").onclick=async()=>{
    const text=document.getElementById("cmsg").value.trim(); if(!text) return;
    chat.messages.push({id:crypto.randomUUID(),from:me.id,text:cleanText(text).slice(0,200),at:Date.now()});
    await db("set",T.chats,id,chat);
    me.daily.chats=(me.daily.chats||0)+1; await saveMe();
    await notify(otherId,{type:"chat",text:`${me.name} mandou mensagem.`});
    renderChat(box, otherId);
  };
  document.getElementById("cstk").onclick=async()=>{
    const pick=await pickSticker(); if(!pick) return;
    try{
      await spendEnergy(1);
      const key=typeof pick==="string"?pick:`${pick.id}#${pick.shine||""}`;
      const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}` )===key);
      if(ix>=0) me.backpack.stickers.splice(ix,1);
      chat.messages.push({id:crypto.randomUUID(),from:me.id,text:"",sticker:key,at:Date.now()});
      await db("set",T.chats,id,chat); await saveMe();
      await notify(otherId,{type:"chat",text:`${me.name} enviou figurinha.`});
      renderChat(box, otherId);
    }catch(ex){ toast(ex.message); }
  };
  document.getElementById("cenergy").onclick=async()=>{
    if(me.coins<50) return toast(t("coinsLow"));
    me.coins-=50;
    const u=await userById(otherId); if(!u) return;
    u.gifts=u.gifts||[]; u.gifts.push({id:crypto.randomUUID(), type:"energy", n:5, from:me.id, fromName:me.name});
    chat.messages.push({id:crypto.randomUUID(),from:me.id,text:lang==="en"?"sent energy":"enviou energia",kind:"energy",at:Date.now()});
    await db("set",T.chats,id,chat); await saveMe(); await saveUser(u);
    await notify(otherId,{type:"gift",text:`${me.name} enviou energia.`});
    toast(lang==="en"?"Energy ordered":"Energia encomendada");
    renderChat(box, otherId);
  };
  bindUsers();
}
async function askFriend(id){
  const u=await userById(id); if(!u) return;
  me.reqOut=me.reqOut||[]; if(!me.reqOut.includes(id)) me.reqOut.push(id);
  u.reqIn=u.reqIn||[]; if(!u.reqIn.includes(me.id)) u.reqIn.push(me.id);
  await saveMe(); await saveUser(u); await notify(id,{type:"friend",text:`${me.name} pediu amizade.`});
  toast("Pedido enviado."); amigosView();
}
async function acceptFriend(id){
  const u=await userById(id); if(!u) return;
  me.friends=[...new Set([...(me.friends||[]),id])]; me.reqIn=(me.reqIn||[]).filter(x=>x!==id);
  u.friends=[...new Set([...(u.friends||[]),me.id])]; u.reqOut=(u.reqOut||[]).filter(x=>x!==me.id);
  await saveMe(); await saveUser(u); await notify(id,{type:"friendOk",text:`${me.name} aceitou a amizade.`});
  amigosView();
}
async function denyFriend(id){ me.reqIn=(me.reqIn||[]).filter(x=>x!==id); await saveMe(); amigosView(); }

  root.querySelector("#emerg")?.addEventListener("click", emergencyOrb);
  root.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>buyPack(b.dataset.pack));
  root.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>buyFrame(b.dataset.fr));
}
function renderShop(){
  const el=document.getElementById("shop");
  el.innerHTML=shopHTML();
  bindShop(el);
}
function mercadoView(){
  app.innerHTML=`<p class="eyebrow">${t("shop")}</p><h1>${t("market")}</h1>${hud()}
    <h2>${t("energy")}</h2>${orbHTML()}
    <h2>${t("packs")}</h2>
    ${PACKS.map(p=>`<div class="item"><b>${p.n}</b><p class="muted">${p.price} ${t("coins")}</p>
      <button class="cta" data-pack="${p.id}">${t("buyPack")}</button></div>`).join("")}
    <h2>${t("frames")}</h2>
    <div class="row">${FRAMES.map(f=>`<div class="item"><div class="av ${f.id}">${me.avatar.photo?`<img src="${me.avatar.photo}">`:`<span style="display:grid;place-items:center;height:100%">${escapeHtml(me.name.slice(0,1))}</span>`}</div>
      <b>${f.n}</b><p class="muted">${f.price?f.price+" "+t("coins"):t("free")}</p>
      <button class="${me.avatar.frame===f.id?"ghost":"cta"}" data-fr="${f.id}">${me.avatar.frame===f.id?t("equipped"):t("buy")}</button></div>`).join("")}</div>`;
  bindShop(app);
}
async function takeFreeOrb(){
  if(me.energy>=ENERGY_MAX) return toast(t("energyFull"));
  if(me.lastFreeOrb && Date.now()-me.lastFreeOrb<ORB_FREE_MS) return toast(t("waitOrb"));
  me.energy=Math.min(ENERGY_MAX, me.energy+1);
  me.lastFreeOrb=Date.now();
  await saveMe(); toast("+1"); render();
}
async function emergencyOrb(){
  if(me.coins<EMERGENCY_COST) return toast(t("coinsLow"));
  me.coins-=EMERGENCY_COST;
  me.energy=Math.min(ENERGY_MAX, me.energy+5);
  await saveMe(); toast("+5"); render();
}
async function buyPack(id){
  const p=PACKS.find(x=>x.id===id); if(!p) return;
  if(me.coins<p.price) return toast(t("coinsLow"));
  me.coins-=p.price; me.backpack.packs[id]=(me.backpack.packs[id]||0)+1; await saveMe();
  toast(t("packBag"));
}
async function buyFrame(id){
  const f=FRAMES.find(x=>x.id===id); if(me.avatar.frame===id) return;
  if(me.coins<f.price) return toast(t("coinsLow"));
  me.coins-=f.price; me.avatar.frame=id; await saveMe();
  if(view==="mercado") mercadoView(); else renderShop();
}

function stackStickers(list){
  const map={};
  (list||[]).forEach(s=>{
    const p=parseStk(s);
    const key=p.id+"#"+(p.shine||"");
    map[key]=map[key]||{key, item:s, n:0};
    map[key].n++;
  });
  return Object.values(map);
}
function renderBag(){
  const packs=me.backpack.packs||{};
  const stacks=stackStickers(me.backpack.stickers);
  document.getElementById("bag").innerHTML=`
    <h2>${t("bag")}</h2>
    ${PACKS.map(p=>`<div class="item"><b>${p.n}</b> × ${packs[p.id]||0}
      <button class="cta" data-op="${p.id}" ${(packs[p.id]||0)?"":"disabled"}>${t("open")}</button></div>`).join("")}
    <h2>Stickers</h2>
    <div class="stickers">${stacks.map(s=>`<span class="stk-wrap" draggable="true" data-stk="${s.key}">${stkIcon(s.item)}${s.n>1?`<i class="qty">${s.n}</i>`:""}</span>`).join("")||`<span class="muted">${t("empty")}</span>`}</div>
    <button class="ghost" id="send-stk">${t("sendStk")}</button>`;
  document.getElementById("bag").querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>openPack(b.dataset.op));
  document.getElementById("send-stk").onclick=sendSticker;
  bindStickerDrag();
  spawnVases();
}
function spawnVases(){
  document.querySelectorAll(".vase").forEach(v=>v.remove());
  (me.gifts||[]).filter(g=>g.type==="energy").forEach((g,i)=>{
    const b=document.createElement("button");
    b.className="vase";
    b.type="button";
    b.title="+5";
    b.textContent="🏺";
    b.style.left=(18+i*18)+"%";
    b.style.top=(30+(i%3)*16)+"%";
    b.onclick=async()=>{
      me.energy=Math.min(ENERGY_MAX, me.energy+ (g.n||5));
      me.gifts=(me.gifts||[]).filter(x=>x.id!==g.id);
      await saveMe(); toast("+5"); b.remove(); render();
    };
    document.body.appendChild(b);
  });
}
function bindStickerDrag(){
  document.querySelectorAll("[data-stk]").forEach(el=>{
    el.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/stk", el.dataset.stk);
      e.dataTransfer.effectAllowed="copy";
      document.getElementById("scrim").style.pointerEvents="none";
    });
    el.addEventListener("dragend", ()=>{ document.getElementById("scrim").style.pointerEvents=""; });
    el.addEventListener("touchstart", ev=>{
      el.dataset.dragging="1";
      document.getElementById("scrim").style.pointerEvents="none";
    }, {passive:true});
    el.addEventListener("touchend", ev=>{
      const t=ev.changedTouches[0];
      const hit=document.elementFromPoint(t.clientX,t.clientY);
      dropSticker(el.dataset.stk, hit);
      document.getElementById("scrim").style.pointerEvents="";
    });
  });
  document.querySelectorAll("[data-post], [data-user]").forEach(el=>{
    el.addEventListener("dragover", e=>{ e.preventDefault(); });
    el.addEventListener("drop", e=>{
      e.preventDefault();
      dropSticker(e.dataTransfer.getData("text/stk"), el);
    });
  });
}
async function dropSticker(key, target){
  if(!key || !target) return;
  const post=target.closest?.("[data-post]");
  const user=target.closest?.("[data-user]");
  if(post){
    const pick=key.endsWith("#")?key.slice(0,-1):key;
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}` )===pick || (typeof s==="string"?s:`${s.id}#${s.shine||""}`)===key);
    if(ix<0) return;
    try{
      await spendEnergy(1);
      me.backpack.stickers.splice(ix,1); await saveMe();
      const p=await loadPost(post.dataset.post);
      p.stickers=p.stickers||[]; p.stickers.push({stickerId:parseStk(key).id, from:me.id, shine:parseStk(key).shine});
      await db("set",T.posts,p.id,p);
      me.daily.stick=(me.daily.stick||0)+1; await saveMe();
      toast(t("sent")); renderBag(); if(view==="comunidade"||view==="casa") render();
    }catch(ex){ toast(ex.message); }
    return;
  }
  if(user && user.dataset.user && user.dataset.user!==me.id){
    const pick=key;
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}` )===pick);
    if(ix<0) return;
    try{
      await spendEnergy(1);
      me.backpack.stickers.splice(ix,1); await saveMe();
      await db("set",T.mail,crypto.randomUUID(),{to:user.dataset.user,from:me.id,fromName:me.name,stickerId:parseStk(key).id,createdAt:Date.now()});
      await notify(user.dataset.user,{type:"gift",text:`${me.name} te enviou uma figurinha.`});
      toast(t("sent")); renderBag();
    }catch(ex){ toast(ex.message); }
  }
}
function rollShine(){
  if (Math.random() > 0.1) return "";
  return Math.random() < 0.5 ? "gold" : "silver";
}
async function openPack(id){
  const p=PACKS.find(x=>x.id===id); if(!p||!(me.backpack.packs[id]>0)) return;
  me.backpack.packs[id]-=1;
  const got=[];
  for(let i=0;i<3;i++){
    const sid=p.stickers[Math.floor(Math.random()*p.stickers.length)];
    const shine=rollShine();
    const item=shine?`${sid}#${shine}`:sid;
    me.backpack.stickers.push(item);
    got.push(item);
  }
  me.daily.packs=(me.daily.packs||0)+1;
  if(!me.daily.claimed.pack){ me.daily.claimed.pack=true; me.coins+=5; }
  await saveMe();
  const shiny=got.map(parseStk).filter(x=>x.shine);
  openModal(`<h2>${t("packOpen")}</h2><div class="stickers">${got.map(stkIcon).join("")}</div>
    <p class="muted">${shiny.map(s=>s.shine==="gold"?t("shinyGold"):t("shinySilver")).join(" · ")}</p>
    <button class="cta" id="mok">${t("ok")}</button>`);
  document.getElementById("mok").onclick=()=>{ closeModal(); renderBag(); };
}
async function sendSticker(){
  if(guardBan()) return;
  if(!(me.backpack.stickers||[]).length) return toast("Sem figurinhas.");
  let people=[]; try{ people=listOf(await db("list",T.pub)).map(x=>x.value).filter(p=>p&&p.id!==me.id); }catch{}
  const who=await uiPick("Enviar para", people.map(p=>({id:p.id,label:p.name}))); if(!who) return;
  const pick=await pickSticker(); if(!pick) return;
  try{
    await spendEnergy(1);
    const ix=me.backpack.stickers.findIndex(s=>(typeof s==="string"?s:`${s.id}#${s.shine||""}`)===(typeof pick==="string"?pick:pick.id));
    if(ix>=0) me.backpack.stickers.splice(ix,1); await saveMe();
    await db("set",T.mail,crypto.randomUUID(),{to:who.id,from:me.id,fromName:me.name,stickerId:pick,createdAt:Date.now()});
    await notify(who.id,{type:"gift",text:`${me.name} te enviou uma figurinha.`});
    toast("Enviado."); renderBag();
  }catch(ex){ toast(ex.message); }
}
function renderNotes(){
  const notes=me.notes||[];
  openModal(`<h2>${t("notes")}</h2>${notes.map(n=>`<div class="item">${escapeHtml(n.text)}
    <button class="danger" data-deln="${n.id}">${t("del")}</button></div>`).join("")||`<p class="muted">${t("empty")}</p>`}
    <button class="cta" id="mok">${t("ok")}</button>`);
  document.getElementById("modal").querySelectorAll("[data-deln]").forEach(b=>b.onclick=async()=>{
    me.notes=(me.notes||[]).filter(n=>n.id!==b.dataset.deln);
    await saveMe(); refreshBadge(); renderNotes();
  });
  document.getElementById("mok").onclick=async()=>{ (me.notes||[]).forEach(n=>n.read=true); await saveMe(); refreshBadge(); closeModal(); };
}

function toAvatar(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement("canvas"); c.width=128; c.height=128;
      const s=Math.min(img.width,img.height);
      const sx=(img.width-s)/2, sy=(img.height-s)/2;
      c.getContext("2d").drawImage(img,sx,sy,s,s,0,0,128,128);
      resolve(c.toDataURL("image/jpeg",0.8));
    };
    img.onerror=reject; img.src=url;
  });
}
async function startDeleteAccount(){
  const code=String(Math.floor(100000+Math.random()*900000));
  me.deleteHash=await hashPass(me.email,"del|"+code);
  me.deleteUntil=Date.now()+20*60*1000;
  await saveMe();
  await sendResetEmail(me.email, code);
  const typed=await uiText(lang==="en"?"Code from email to delete":"Código do e-mail para apagar", t("code"));
  if(!typed) return;
  if(Date.now()>me.deleteUntil || me.deleteHash!==await hashPass(me.email,"del|"+typed)) return toast(t("badCode"));
  try{ await db("delete", T.users, me.email); await db("delete", T.pub, me.id); await db("delete", T.uid, me.id); }catch{}
  localStorage.removeItem("ag_session"); me=null; toast(lang==="en"?"Account removed":"Conta apagada"); render();
}

async function render(){
  document.body.classList.toggle("logged", Boolean(me));
  applyTheme(); closeSides();
  document.getElementById("fab-post")?.classList.add("hidden");
  if(!me){ nav.innerHTML=""; return authView(); }
  navBar(); refreshBadge();
  if(view==="casa") return casaView();
  if(view==="jogos") return jogosView();
  if(view==="comunidade") return comunidadeView();
  if(view==="amigos") return amigosView();
  if(view==="mercado") return mercadoView();
  return euView();
}

document.getElementById("fab-post").onclick=openComposer;
document.getElementById("btn-shop").onclick=()=>openSide("shop");
document.getElementById("btn-bag").onclick=()=>{ renderBag(); document.getElementById("bag").classList.add("show"); document.getElementById("scrim").classList.add("show"); };
document.getElementById("btn-notes").onclick=renderNotes;
document.getElementById("scrim").onclick=closeSides;
document.getElementById("modal-bg").addEventListener("click",e=>{ if(e.target.id==="modal-bg") closeModal(); });
overlay.addEventListener("click",e=>{ if(e.target===overlay) overlay.classList.remove("show"); });

function markShift(e, down){
  if(e.code==="ShiftLeft" || e.key==="Shift" && e.location===1) shifts.left=down;
  if(e.code==="ShiftRight" || e.key==="Shift" && e.location===2) shifts.right=down;
  if(e.code==="ShiftLeft") shifts.left=down;
  if(e.code==="ShiftRight") shifts.right=down;
  if(shifts.left && shifts.right) startHold();
  else endHold();
}
function tickHold(){
  if(!playingId){ endHold(); return; }
  holdMs+=200;
  const hint=document.getElementById("exit-hint");
  hint.style.display="block";
  hint.textContent=`${t("holdExit")} ${Math.min(5,holdMs/1000).toFixed(1)}s`;
  if(holdMs>=5000){ hint.style.display="none"; holdMs=0; clearInterval(holdTimer); holdTimer=0; stopPlay(); }
}
function startHold(){ if(holdTimer || !playingId) return; holdMs=0; holdTimer=setInterval(tickHold,200); }
function endHold(){ clearInterval(holdTimer); holdTimer=0; holdMs=0; const h=document.getElementById("exit-hint"); if(h) h.style.display="none"; }

function onPlayKeyDown(e){ if(!playingId) return; markShift(e,true); }
function onPlayKeyUp(e){ if(!playingId) return; markShift(e,false); }
function onPlayTouchStart(e){ if(playingId && e.touches.length>=6) startHold(); else if(playingId && e.touches.length<6) endHold(); }
function onPlayTouchEnd(e){ if(e.touches.length<6) endHold(); }

function hookPlayEvents(){
  const frame=document.getElementById("frame");
  const add=(target)=>{
    if(!target || target.__agExit) return;
    target.__agExit=true;
    target.addEventListener("keydown", onPlayKeyDown, true);
    target.addEventListener("keyup", onPlayKeyUp, true);
    target.addEventListener("touchstart", onPlayTouchStart, {passive:true, capture:true});
    target.addEventListener("touchend", onPlayTouchEnd, {passive:true, capture:true});
    target.addEventListener("touchcancel", onPlayTouchEnd, {passive:true, capture:true});
  };
  add(window); add(document);
  try{
    const doc=frame.contentDocument;
    add(doc); add(doc.defaultView);
  }catch{}
}

window.addEventListener("keydown", onPlayKeyDown, true);
window.addEventListener("keyup", onPlayKeyUp, true);
document.getElementById("player").addEventListener("touchstart", onPlayTouchStart, {passive:true});
document.getElementById("player").addEventListener("touchend", onPlayTouchEnd, {passive:true});

async function stopPlay(){
  endHold();
  shifts.left=false; shifts.right=false;
  const id=playingId, started=playStart;
  playingId=null; playStart=0;
  document.getElementById("player").classList.remove("show");
  try{ document.getElementById("frame").src="about:blank"; }catch{}
  try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch{}
  if(id && started && me){
    const elapsed=Math.max(0, Date.now()-started);
    me.playMs=me.playMs||{};
    me.playMs[id]=(me.playMs[id]||0)+elapsed;
    me.playTotalMs=(me.playTotalMs||0)+elapsed;
    me.daily=me.daily||{};
    me.daily.playMs=(me.daily.playMs||0)+elapsed;
    me.daily.playMin=Math.floor((me.daily.playMs||0)/60000);
    const min=Math.floor(elapsed/60000);
    if(min>0) me.coins+=Math.min(15,min);
    if((me.daily.playMs>=5*60000) && !me.daily.claimed.play){ me.daily.claimed.play=true; me.coins+=10; }
    bumpStreak();
    try{ await saveMe(); }catch{}
    navigator.serviceWorker?.controller?.postMessage({type:"evict",id});
  }
}

async function boot(){
  await loadCatalog();
  if(location.protocol!=="file:" && "serviceWorker" in navigator){ try{ await navigator.serviceWorker.register("sw.js"); }catch{} }
  const sess=JSON.parse(localStorage.getItem("ag_session")||"null");
  if(sess?.email){
    try{
      const r=await db("get",T.users,sess.email);
      if(r?.value){ me=r.value; me.notes=me.notes||[]; me.backpack.packs=me.backpack.packs||{emoji:0,denselands:0,hillfight:0,driftmania:0}; applyDaily(me); await saveMe(); }
    }catch{}
  }
  applyTheme(); render();
}
boot();
